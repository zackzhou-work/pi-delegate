<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi-delegate · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · pi-delegate</p>
    <h1>One task in, a background job out</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pi-delegate-arch-title pi-delegate-arch-desc">
      <title id="pi-delegate-arch-title">pi-delegate architecture</title>
      <desc id="pi-delegate-arch-desc">Architecture diagram of pi-delegate: Claude Code and Codex delegate tasks through the companion CLI to a local pi agent running as a detached background job; results and working-tree edits flow back for collection and post-hoc audit.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Zones -->
      <rect x="32" y="64" width="200" height="256" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="56" y="68" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="132" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">HARNESS · 10-MIN SHELL BUDGET</text>

      <rect x="280" y="64" width="408" height="336" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="416" y="68" width="136" height="12" rx="2" fill="#f5f5f5"/>
      <text x="484" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">DETACHED JOB · NO TIMEOUT</text>

      <rect x="712" y="64" width="256" height="336" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="764" y="68" width="152" height="12" rx="2" fill="#f5f5f5"/>
      <text x="840" y="77" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">YOUR REPO · AUDITED POST-HOC</text>

      <!-- Arrows first (behind boxes) -->
      <!-- A. Claude Code → companion -->
      <path d="M 192,128 H 276 Q 284,128 284,136 V 164 Q 284,172 292,172 H 312"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B. Codex → companion -->
      <path d="M 192,256 H 276 Q 284,256 284,248 V 196 Q 284,204 292,204 H 312"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- C. companion → pi agent (primary, accent) -->
      <line x1="464" y1="192" x2="520" y2="192" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- D. pi agent → working tree -->
      <path d="M 648,192 H 716 Q 724,192 724,200 V 232 Q 724,240 732,240 H 744"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- E. pi agent → job store (write-back, dashed) -->
      <path d="M 560,224 V 276 Q 552,276 552,284 H 376 Q 368,284 368,292 V 304"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- F. companion → job store -->
      <path d="M 384,224 V 256 Q 384,264 392,264 H 432 Q 440,264 440,272 V 304"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- G. collect return → Claude Code (dashed) -->
      <path d="M 352,160 V 52 H 20 Q 12,52 12,60 V 120 Q 12,128 20,128 H 64"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- H. collect return → Codex (dashed) -->
      <path d="M 416,160 V 36 H 32 Q 24,36 24,44 V 236 Q 24,244 32,244 H 64"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Arrow labels -->
      <rect x="192" y="108" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="222" y="117" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">/PI "TASK"</text>

      <rect x="192" y="236" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="222" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">$PI "TASK"</text>

      <rect x="472" y="172" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="181" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPAWN</text>

      <rect x="676" y="206" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="696" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDITS</text>

      <rect x="448" y="264" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="472" y="273" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>

      <rect x="396" y="244" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="412" y="253" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>

      <!-- Node: Claude Code (input) -->
      <rect x="64" y="96" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="96" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="102" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="86" y="111" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CC</text>
      <text x="128" y="130" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code</text>
      <text x="128" y="146" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/pi</text>

      <!-- Node: Codex (input) -->
      <rect x="64" y="224" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="224" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="230" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="86" y="239" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CX</text>
      <text x="128" y="258" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Codex</text>
      <text x="128" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">$pi</text>

      <!-- Node: Companion CLI (focal) -->
      <rect x="304" y="160" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="160" width="160" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="312" y="166" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="326" y="175" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
      <text x="384" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Companion CLI</text>
      <text x="384" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pi-delegate.mjs run</text>

      <!-- Node: Job store (store) -->
      <rect x="304" y="304" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="304" y="304" width="144" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="312" y="310" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="326" y="319" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOBS</text>
      <text x="376" y="338" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Job store</text>
      <text x="376" y="354" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">.pi-delegate/</text>

      <!-- Node: pi agent (backend) -->
      <rect x="520" y="160" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="160" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="528" y="166" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="542" y="175" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PI</text>
      <text x="584" y="194" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">pi agent</text>
      <text x="584" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">local pi -p</text>

      <!-- Node: Git working tree (store) -->
      <rect x="744" y="208" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="744" y="208" width="128" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="752" y="214" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="766" y="223" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TREE</text>
      <text x="808" y="242" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Git working tree</text>
      <text x="808" y="258" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">git status --porcelain</text>

      <!-- Legend strip -->
      <line x1="40" y1="452" x2="960" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="468" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="480" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="489" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / entry point</text>

      <rect x="196" y="480" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="216" y="489" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend</text>

      <rect x="312" y="480" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="332" y="489" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

      <rect x="428" y="480" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="448" y="489" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Harness</text>

      <line x1="548" y1="485" x2="576" y2="485" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="584" y="489" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>

      <line x1="700" y1="485" x2="728" y2="485" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="736" y="489" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async / collect</text>
    </svg>
  </div>
</body>
</html>
